# Native Render services for TalentOS. No Docker is used.
databases:
  - name: talentos-postgres
    databaseName: talentos
    user: talentos
    plan: 0.1c-256mb
    postgresMajorVersion: "18"
    ipAllowList: []

services:
  - type: keyvalue
    name: talentos-redis
    plan: starter
    ipAllowList: []

  - type: web
    name: talentos-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    initialDeployHook: python -m app.scripts.seed_question_bank
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: talentos-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: talentos-redis
          type: keyvalue
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: JUDGE0_API_URL
        sync: false
      - key: JUDGE0_API_KEY
        sync: false

  - type: worker
    name: talentos-worker
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        fromService:
          name: talentos-api
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: talentos-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: talentos-redis
          type: keyvalue
          property: connectionString
      - key: GEMINI_API_KEY
        fromService:
          name: talentos-api
          type: web
          envVarKey: GEMINI_API_KEY
      - key: GEMINI_API_KEY_2
        fromService:
          name: talentos-api
          type: web
          envVarKey: GEMINI_API_KEY_2
      - key: XAI_API_KEY
        fromService:
          name: talentos-api
          type: web
          envVarKey: XAI_API_KEY
      - key: JUDGE0_API_URL
        fromService:
          name: talentos-api
          type: web
          envVarKey: JUDGE0_API_URL
      - key: JUDGE0_API_KEY
        fromService:
          name: talentos-api
          type: web
          envVarKey: JUDGE0_API_KEY
